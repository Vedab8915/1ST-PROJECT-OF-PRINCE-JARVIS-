<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; background: #00060a; overflow: hidden; }
    .maplibregl-ctrl-group { background: #06151d !important; border: 1px solid #00a9c9 !important; }
    .maplibregl-ctrl button { filter: invert(.8) sepia(1) saturate(4) hue-rotate(145deg); }
    .maplibregl-ctrl-attrib { background: rgba(0,8,12,.85) !important; color: #d8f8ff !important; }
    .maplibregl-ctrl-attrib a { color: #6feaff !important; }
    #status { position: absolute; z-index: 3; bottom: 30px; left: 12px; max-width: 75%;
      padding: 7px 10px; color: #8ffcff; background: #001018dd; border: 1px solid #0d6077;
      border-radius: 4px; font: 12px 'Bahnschrift', sans-serif; pointer-events: none; }
    #details { position: absolute; z-index: 3; top: 12px; left: 12px; width: min(370px, 68%);
      padding: 10px 12px; color: #d7f8ff; background: rgba(0, 12, 20, .9);
      border: 1px solid #0d6077; border-radius: 5px; font: 12px/1.5 'Bahnschrift', sans-serif;
      pointer-events: none; box-shadow: 0 4px 18px #0008; }
    #details .place { color: #43e8ff; font-size: 14px; font-weight: 700; }
    #details .muted { color: #85aeb8; }
    #live-controls { position:absolute;z-index:4;top:66px;right:12px;display:flex;gap:5px;flex-direction:column; }
    #live-controls button { min-width:116px;padding:8px 10px;color:#77dff4;background:#00131dcc;
      border:1px solid #15556a;border-radius:4px;font:700 10px 'Bahnschrift',sans-serif;cursor:pointer; }
    #live-controls button.active { color:#001018;background:#42e8d4;border-color:#42e8d4; }
    #live-counts { position:absolute;z-index:3;right:12px;bottom:30px;padding:7px 9px;color:#d7f8ff;
      background:#001018dd;border:1px solid #0d6077;border-radius:4px;font:11px 'Bahnschrift',sans-serif; }
  </style>
</head>
<body>
  <div id="map"></div><div id="status">SATELLITE GLOBE · Ready</div>
  <div id="details"><span class="muted">Choose MY LOCATION or search a place for local details and current weather.</span></div>
  <div id="live-controls">
    <button id="flights-toggle" onclick="toggleLive('flights')">✈  LIVE FLIGHTS · OFF</button>
    <button id="ships-toggle" onclick="toggleLive('ships')">◆  LIVE SHIPS · OFF</button>
    <button id="follow-toggle" onclick="toggleFollow()" style="display:none">◎  FOLLOW TARGET</button>
    <button onclick="refreshLive()">↻  REFRESH CONTACTS</button>
  </div>
  <div id="live-counts">LIVE CONTACTS · Flights 0 · Ships 0</div>
  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"
    onerror="document.getElementById('status').textContent='MAP RENDERER UNAVAILABLE · Check internet access'"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    const status = document.getElementById('status');
    let jarvisBridge = null;
    let liveLayers = {flights:false, ships:false};
    let followedTarget = null;
    const aircraftPaths = new Map(), shipPaths = new Map();
    if (window.qt && qt.webChannelTransport) {
      new QWebChannel(qt.webChannelTransport, channel => {
        jarvisBridge = channel.objects.jarvisBridge;
        for (const layer of ['flights','ships']) if (liveLayers[layer]) jarvisBridge.requestLiveLayer(layer, true);
        refreshLive();
      });
    }
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        projection: {type: 'globe'},
        glyphs: 'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
        sources: {
          imagery: {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            // Esri's high-resolution cache is not populated at every zoom in
            // every area. Declare the native detail ceiling so MapLibre
            // enlarges the last available satellite tile instead of asking
            // the service for empty tiles when the user keeps zooming.
            maxzoom: 19,
            attribution: 'Imagery © Esri, Maxar, Earthstar Geographics, and the GIS User Community'
          }
        },
        layers: [{id: 'satellite', type: 'raster', source: 'imagery', 'raster-resampling': 'linear'}],
        sky: { 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] }
      },
      center: [20, 20], zoom: 1.6, maxZoom: 22, pitch: 0, attributionControl: true
    });
    map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), 'top-right');
    let aircraftCount = 0, shipCount = 0;
    function updateCounts() {
      document.getElementById('live-counts').textContent = `LIVE CONTACTS · Flights ${aircraftCount} · Ships ${shipCount}`;
    }
    function toggleLive(layer, force) {
      liveLayers[layer] = typeof force === 'boolean' ? force : !liveLayers[layer];
      const button = document.getElementById(layer + '-toggle');
      button.classList.toggle('active', liveLayers[layer]);
      button.textContent = (layer === 'flights' ? '✈  LIVE FLIGHTS · ' : '◆  LIVE SHIPS · ') + (liveLayers[layer] ? 'ON' : 'OFF');
      if (jarvisBridge) jarvisBridge.requestLiveLayer(layer, liveLayers[layer]);
      if (!liveLayers[layer]) {
        const source = map.getSource(layer === 'flights' ? 'aircraft-source' : 'ships-source');
        if (source) source.setData({type:'FeatureCollection',features:[]});
        const trails = map.getSource(layer === 'flights' ? 'aircraft-trail-source' : 'ship-trail-source');
        if (trails) trails.setData({type:'FeatureCollection',features:[]});
        if (layer === 'flights') aircraftPaths.clear(); else shipPaths.clear();
        if (layer === 'flights') aircraftCount = 0; else shipCount = 0;
        updateCounts();
      }
      return liveLayers[layer];
    }
    function toggleFollow() {
      followedTarget = null;
      document.getElementById('follow-toggle').style.display = 'none';
      status.textContent = 'TARGET FOLLOW · Off';
    }
    window.jarvisSetLiveLayers = layers => {
      for (const layer of (Array.isArray(layers) ? layers : [])) if (['flights','ships'].includes(layer)) toggleLive(layer, true);
    };
    window.jarvisSetLayerState = (layer, enabled) => { if (['flights','ships'].includes(layer)) toggleLive(layer, !!enabled); };
    window.jarvisLiveStatus = message => { status.textContent = String(message || '').slice(0,180); };
    window.jarvisLiveEnabled = layer => !!liveLayers[layer];
    window.refreshLive = () => {
      if (jarvisBridge) jarvisBridge.reportViewport(JSON.stringify({center:map.getCenter().toArray(),zoom:map.getZoom()}));
    };
    map.on('load', () => {
      map.setFog({});
      map.addSource('aircraft-source',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      map.addSource('aircraft-heading-source',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      map.addSource('aircraft-trail-source',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      map.addSource('ships-source',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      map.addSource('ship-trail-source',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      map.addLayer({id:'aircraft-trails',type:'line',source:'aircraft-trail-source',paint:{'line-color':'#26b9db','line-width':2,'line-opacity':0.48}});
      map.addLayer({id:'aircraft-headings',type:'line',source:'aircraft-heading-source',paint:{'line-color':'#66e8ff','line-width':1.5,'line-opacity':0.8}});
      map.addLayer({id:'aircraft-dots',type:'circle',source:'aircraft-source',paint:{'circle-radius':['interpolate',['linear'],['zoom'],2,3,9,6],'circle-color':'#43dfff','circle-stroke-color':'#00131a','circle-stroke-width':1.5}});
      map.addLayer({id:'aircraft-labels',type:'symbol',source:'aircraft-source',minzoom:3,layout:{'text-field':['get','flight'],'text-font':['Open Sans Regular'],'text-size':10,'text-offset':[0,1.2],'text-optional':true},paint:{'text-color':'#d9fbff','text-halo-color':'#001018','text-halo-width':1.2}});
      map.addLayer({id:'ship-dots',type:'circle',source:'ships-source',paint:{'circle-radius':['interpolate',['linear'],['zoom'],2,3,9,6],'circle-color':'#ffd34e','circle-stroke-color':'#1d1700','circle-stroke-width':1.5}});
      map.addLayer({id:'ship-trails',type:'line',source:'ship-trail-source',paint:{'line-color':'#f3c641','line-width':2,'line-opacity':0.5}});
      map.addLayer({id:'ship-labels',type:'symbol',source:'ships-source',minzoom:3,layout:{'text-field':['get','name'],'text-font':['Open Sans Regular'],'text-size':10,'text-offset':[0,1.2],'text-optional':true},paint:{'text-color':'#ffe998','text-halo-color':'#171100','text-halo-width':1.2}});
      for (const [layer, title] of [['aircraft-dots','AIRCRAFT'],['ship-dots','VESSEL']]) map.on('click',layer,e=>{
        const f=e.features?.[0]; if (!f) return; const p=f.properties||{};
        followedTarget={layer:layer==='aircraft-dots'?'flights':'ships',id:String(p.hex||p.mmsi||p.flight||p.name||'')};
        const followButton=document.getElementById('follow-toggle');
        followButton.textContent='◎  STOP FOLLOWING';
        followButton.style.display='block';
        status.textContent=`TRACKING ${p.flight||p.name||p.hex||p.mmsi||title} · Live position updates`;
        const body=layer==='aircraft-dots'?`${p.flight||'Unknown flight'} · ${p.type||'Aircraft'}\n${p.altitude||'Altitude unknown'} · ${p.speed||'Speed unknown'} · heading ${p.track||'unknown'}°\n${p.route||'Route unavailable'}\nSeen ${p.seen||'?'} sec ago`:`${p.name||'Unknown vessel'} · ${p.type||'Vessel'}\n${p.destination||'Destination unavailable'} · speed ${p.speed||'?'} kn · heading ${p.track||'?'}°`;
        new maplibregl.Popup().setLngLat(e.lngLat).setText(body).addTo(map);
      });
      map.on('moveend',()=>{ if (jarvisBridge && (liveLayers.flights||liveLayers.ships)) refreshLive(); });
      status.textContent = 'SATELLITE GLOBE · Search a place or locate this device';
    });
    function makeHeading(lon,lat,track) {
      if (!Number.isFinite(track)) return null;
      const d=0.006, brng=track*Math.PI/180, p1=lat*Math.PI/180, l1=lon*Math.PI/180;
      const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(brng));
      const l2=l1+Math.atan2(Math.sin(brng)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));
      return {type:'Feature',geometry:{type:'LineString',coordinates:[[lon,lat],[((l2*180/Math.PI+540)%360)-180,p2*180/Math.PI]]},properties:{}};
    }
    window.jarvisSetAircraft = data => {
      if (!liveLayers.flights || !map.getSource('aircraft-source')) return;
      const rows=Array.isArray(data)?data:[];
      const features=[],heads=[],trails=[],activeIds=new Set();
      for (const a of rows) {
        const lon=Number(a.lon),lat=Number(a.lat); if(!Number.isFinite(lon)||!Number.isFinite(lat)) continue;
        const flight=String(a.flight||'').trim();
        const id=String(a.hex||flight||`${lat},${lon}`);
        activeIds.add(id);
        features.push({type:'Feature',geometry:{type:'Point',coordinates:[lon,lat]},properties:{hex:id,flight,type:a.t||'',altitude:typeof a.alt_baro==='number'?`${a.alt_baro} ft`:'Ground/unknown',speed:typeof a.gs==='number'?`${Math.round(a.gs)} kt`:'unknown',track:a.track,seen:a.seen_pos,route:a.route||'Route unavailable'}});
        const old=aircraftPaths.get(id)||[]; if(!old.length||Math.abs(old[old.length-1][0]-lon)+Math.abs(old[old.length-1][1]-lat)>0.002) old.push([lon,lat]);
        aircraftPaths.set(id,old.slice(-18));
        if(old.length>1) trails.push({type:'Feature',geometry:{type:'LineString',coordinates:old.slice(-18)},properties:{}});
        const h=makeHeading(lon,lat,Number(a.track)); if(h) heads.push(h);
        if(followedTarget?.layer==='flights'&&followedTarget.id===id) map.easeTo({center:[lon,lat],duration:700});
      }
      for (const key of aircraftPaths.keys()) if (!activeIds.has(key)) aircraftPaths.delete(key);
      map.getSource('aircraft-source').setData({type:'FeatureCollection',features});
      map.getSource('aircraft-heading-source').setData({type:'FeatureCollection',features:heads});
      map.getSource('aircraft-trail-source').setData({type:'FeatureCollection',features:trails});
      aircraftCount=features.length; updateCounts();
    };
    window.jarvisSetShips = data => {
      if (!liveLayers.ships || !map.getSource('ships-source')) return;
      const rows=Array.isArray(data)?data:[];
      const activeIds=new Set(),trails=[], features=rows.filter(a=>Number.isFinite(Number(a.lon))&&Number.isFinite(Number(a.lat))).map(a=>{
        const id=String(a.mmsi||a.name||''); const lon=Number(a.lon),lat=Number(a.lat);
        activeIds.add(id);
        const old=shipPaths.get(id)||[]; if(!old.length||Math.abs(old[old.length-1][0]-lon)+Math.abs(old[old.length-1][1]-lat)>0.002) old.push([lon,lat]);
        shipPaths.set(id,old.slice(-18)); if(old.length>1) trails.push({type:'Feature',geometry:{type:'LineString',coordinates:old.slice(-18)},properties:{}});
        if(followedTarget?.layer==='ships'&&followedTarget.id===id) map.easeTo({center:[lon,lat],duration:700});
        return {type:'Feature',geometry:{type:'Point',coordinates:[lon,lat]},properties:{mmsi:id,name:a.name||id||'Vessel',type:a.type||'Vessel',destination:a.destination||'Destination unavailable',speed:a.speed||'',track:a.track||''}};
      });
      for (const key of shipPaths.keys()) if (!activeIds.has(key)) shipPaths.delete(key);
      map.getSource('ships-source').setData({type:'FeatureCollection',features});
      map.getSource('ship-trail-source').setData({type:'FeatureCollection',features:trails}); shipCount=features.length; updateCounts();
    };
    // Individual imagery tiles may be absent at a location/zoom. Keep the map
    // useful and retain the closest available imagery instead of replacing the
    // location status with a frightening "data not found" message.
    map.on('error', (e) => { if (e && e.error) console.warn('[Map imagery]', e.error.message || e.error); });
    map.on('zoomend', () => {
      if (map.getZoom() > 19) {
        status.textContent = 'SATELLITE VIEW · Enlarging the closest available imagery';
      } else if (status.textContent.includes('Enlarging the closest available imagery')) {
        status.textContent = 'SATELLITE VIEW · Native imagery detail';
      }
    });
    let marker = null;
    function weatherText(code) {
      return ({0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
        45:'Fog',48:'Freezing fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
        61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Heavy freezing rain',
        71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Rain showers',
        81:'Rain showers',82:'Heavy rain showers',85:'Snow showers',86:'Heavy snow showers',
        95:'Thunderstorm',96:'Thunderstorm with hail',99:'Severe thunderstorm'})[code] || 'Conditions unavailable';
    }
    async function loadPlaceDetails(lat, lon, initialLabel, requestId) {
      const box = document.getElementById('details');
      box.textContent = 'Loading place details and local weather…';
      let place = initialLabel || '';
      let address = null;
      try {
        const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=16&addressdetails=1`,
          {headers: {'Accept':'application/json'}});
        if (rev.ok) {
          address = await rev.json();
          place = address.name || address.address?.city || address.address?.town ||
            address.address?.village || address.address?.county || place;
        }
      } catch (_) { /* coordinates remain useful when geocoding is unavailable */ }
      let weatherLine = 'Weather details unavailable';
      let extra = '';
      let reportWeather = null;
      try {
        const q = new URLSearchParams({latitude:String(lat),longitude:String(lon),
          current:'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m',
          daily:'temperature_2m_max,temperature_2m_min,sunrise,sunset',timezone:'auto',forecast_days:'1'});
        const wr = await fetch(`https://api.open-meteo.com/v1/forecast?${q}`);
        if (wr.ok) {
          const w = await wr.json(), c = w.current || {}, d = w.daily || {};
          weatherLine = `${weatherText(c.weather_code)} · ${Math.round(c.temperature_2m)}°C, feels ${Math.round(c.apparent_temperature)}°C`;
          extra = `Humidity ${Math.round(c.relative_humidity_2m)}% · Wind ${Math.round(c.wind_speed_10m)} km/h · Rain ${Number(c.precipitation || 0).toFixed(1)} mm`;
          if (d.temperature_2m_min?.length) extra += ` · Today ${Math.round(d.temperature_2m_min[0])}°–${Math.round(d.temperature_2m_max[0])}°C`;
          if (c.time) extra += ` · Local time ${c.time.replace('T',' ')}`;
          reportWeather = {description:weatherText(c.weather_code), temperature_c:c.temperature_2m,
            feels_like_c:c.apparent_temperature, humidity_percent:c.relative_humidity_2m,
            wind_kmh:c.wind_speed_10m, precipitation_mm:c.precipitation,
            today_low_c:d.temperature_2m_min?.[0], today_high_c:d.temperature_2m_max?.[0],
            local_time:c.time};
        }
      } catch (_) { /* keep the place and coordinates visible without weather */ }
      const bits = address?.address || {};
      const region = [bits.city || bits.town || bits.village || bits.county, bits.state, bits.country]
        .filter((v, i, a) => v && a.indexOf(v) === i).join(', ');
      const head = document.createElement('div'); head.className = 'place';
      head.textContent = place || initialLabel || 'Selected location';
      const coord = document.createElement('div'); coord.className = 'muted';
      coord.textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}${region ? ' · ' + region : ''}`;
      const weather = document.createElement('div'); weather.textContent = weatherLine;
      const other = document.createElement('div'); other.className = 'muted'; other.textContent = extra;
      box.replaceChildren(head, coord, weather, other);
      if (jarvisBridge) jarvisBridge.reportLocation(JSON.stringify({
        request_id: requestId || '',
        name: place || initialLabel || 'Selected location', region: region,
        latitude:lat, longitude:lon, weather:reportWeather
      }));
    }
    function flyTo(lon, lat, label, requestId) {
      if (!Number.isFinite(lon) || !Number.isFinite(lat)) return;
      status.textContent = 'FLIGHT PATH · ' + label;
      map.flyTo({center: [lon, lat], zoom: 15, pitch: 48, curve: 1.5, speed: 0.72, essential: true});
      loadPlaceDetails(lat, lon, label.startsWith('YOUR LOCATION') ? '' : label, requestId);
      if (marker) marker.remove();
      marker = new maplibregl.Marker({color: '#00d4ff'}).setLngLat([lon, lat]).setPopup(
        new maplibregl.Popup({offset: 24}).setText(label)
      ).addTo(map);
      map.once('moveend', () => { status.textContent = label.toUpperCase() + ' · SATELLITE VIEW'; marker.togglePopup(); });
    }
    window.jarvisFlyTo = async (place, requestId) => {
      const query = String(place || '').trim();
      if (!query) return window.jarvisLocate(requestId);
      status.textContent = 'SEARCHING · ' + query;
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(query);
        const response = await fetch(url, {headers: {'Accept': 'application/json'}});
        if (!response.ok) throw new Error('geocoder unavailable');
        const results = await response.json();
        if (!results.length) { status.textContent = 'PLACE NOT FOUND · ' + query; return; }
        flyTo(Number(results[0].lon), Number(results[0].lat), results[0].display_name, requestId);
      } catch (_) { status.textContent = 'PLACE SEARCH FAILED · Check internet access'; }
    };
    window.jarvisLocate = (requestId) => {
      if (!navigator.geolocation) { status.textContent = 'LOCATION UNAVAILABLE · Device location service not supported'; return; }
      status.textContent = 'REQUESTING DEVICE LOCATION · Allow the permission prompt';
      navigator.geolocation.getCurrentPosition(
        pos => flyTo(pos.coords.longitude, pos.coords.latitude,
          'YOUR LOCATION · ' + pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4), requestId),
        err => { status.textContent = err.code === 1 ? 'LOCATION DENIED · Allow location access to continue' : 'LOCATION UNAVAILABLE · Enable Windows location services'; },
        {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000}
      );
    };
  </script>
</body>
</html>
